name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy app/

  css-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download TailwindCSS CLI
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
      - name: Compile and verify no diff
        run: |
          ./tailwindcss-linux-x64 -i public/tailwind.css -o public/styles.css --minify
          git diff --exit-code public/styles.css || (echo "public/styles.css is stale. Run 'make css' and commit." && exit 1)

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, format, mypy, css-check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cookievale .

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "==> cd to ${{ secrets.PROJECT_PATH }}"
            cd ${{ secrets.PROJECT_PATH }}
            echo "==> pwd: $(pwd)"
            echo "==> git pull"
            git pull
            echo "==> alembic upgrade"
            docker compose exec -T web alembic upgrade head
            echo "==> docker compose up"
            docker compose up -d --build
            echo "==> health check"
            for i in 1 2 3; do
              curl -sf http://localhost:8000/health && break
              echo "Health check attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "==> deploy complete"
