name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy app/

  css-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-tailwind
        with:
          path: tailwindcss-linux-x64
          key: tailwindcss-${{ runner.os }}-3.4.17
      - name: Download TailwindCSS CLI
        if: steps.cache-tailwind.outputs.cache-hit != 'true'
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
      - name: Compile and verify no diff
        run: |
          ./tailwindcss-linux-x64 -i public/tailwind.css -o public/styles.css --minify
          git diff --exit-code public/styles.css || (echo "public/styles.css is stale. Run 'make css' and commit." && exit 1)

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, format, mypy, css-check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cookievale .

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo === Starting deploy ===
            cd /d ${{ secrets.PROJECT_PATH }}
            if errorlevel 1 (
              echo ERROR: cd failed - check PROJECT_PATH secret
              exit /b 1
            )
            echo Current directory: %CD%
            dir

            echo === Git fetch ===
            git fetch origin master
            if errorlevel 1 (
              echo ERROR: git fetch failed
              exit /b 1
            )

            echo === Git reset ===
            git reset --hard origin/master
            if errorlevel 1 (
              echo ERROR: git reset failed
              exit /b 1
            )
            git status

            echo === Docker build ===
            docker compose build
            if errorlevel 1 (
              echo ERROR: docker compose build failed
              exit /b 1
            )

            echo === Docker migrate ===
            docker compose run --rm web alembic upgrade head
            if errorlevel 1 (
              echo ERROR: alembic upgrade failed
              exit /b 1
            )

            echo === Docker up ===
            docker compose up -d --force-recreate
            if errorlevel 1 (
              echo ERROR: docker compose up failed
              exit /b 1
            )

            echo === Health check ===
            set RETRIES=0
            :retry
            curl -sf http://localhost:8000/health && goto :ok
            set /a RETRIES+=1
            if %RETRIES% LSS 5 (
              echo Health check attempt %RETRIES% failed, retrying in 5s...
              timeout /t 5 /nobreak
              goto :retry
            )
            echo ERROR: Health check failed after 5 attempts
            exit /b 1
            :ok

            echo === Deploy complete ===
