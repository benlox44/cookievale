name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.v.outputs.PYTHON_VERSION }}
      postgres: ${{ steps.v.outputs.POSTGRES_VERSION }}
      tailwind: ${{ steps.v.outputs.TAILWIND_VERSION }}
      node: ${{ steps.v.outputs.NODE_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: cat versions.env >> "$GITHUB_OUTPUT"

  ruff:
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.versions.outputs.python }}
      - run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - run: ruff check .
      - run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.versions.outputs.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mypy app/

  test:
    runs-on: ubuntu-latest
    needs: versions
    services:
      postgres:
        image: postgres:${{ needs.versions.outputs.postgres }}-alpine
        env:
          POSTGRES_USER: cookie_user
          POSTGRES_PASSWORD: cookie_pass
          POSTGRES_DB: cookievale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookie_user -d cookievale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.versions.outputs.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql://cookie_user:cookie_pass@localhost:5432/cookievale
          SECRET_KEY: test-secret
          ADMIN_PASSWORD: test-admin
          BASE_URL: http://test.local
          TZ: America/Santiago
          DEBUG: "True"
          CONTAINER_MEDIA_PATH: /tmp/cookievale-test-media
          TRUSTED_PROXY_HOSTS: 127.0.0.1
          TELEGRAM_BOT_TOKEN: test-token
          TELEGRAM_CHAT_ID: "123"
        run: pytest

  css-check:
    runs-on: ubuntu-latest
    needs: versions
    env:
      TAILWIND_VERSION: ${{ needs.versions.outputs.tailwind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-tailwind
        with:
          path: tailwindcss-linux-x64
          key: tailwindcss-${{ runner.os }}-${{ env.TAILWIND_VERSION }}
      - if: steps.cache-tailwind.outputs.cache-hit != 'true'
        run: |
          curl -sSfLO "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tailwindcss-linux-x64
      - run: |
          ./tailwindcss-linux-x64 -i public/tailwind.css -o public/styles.css --minify
          git diff --exit-code public/styles.css || { echo "public/styles.css is stale. Run 'just css' and commit."; exit 1; }

  markdown-lint:
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.versions.outputs.node }}
      - run: npx markdownlint-cli2 "**/*.md"

  pre-commit:
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.versions.outputs.python }}
      - run: pip install "$(grep '^pre-commit==' requirements-dev.txt)"
      - run: pre-commit run --all-files

  docker-build:
    runs-on: ubuntu-latest
    needs: [versions, ruff, mypy, test, css-check, markdown-lint, pre-commit]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PYTHON_VERSION=${{ needs.versions.outputs.python }} -t cookievale .

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SCRIPT="$(cat <<'PSEOF'
          Write-Host "=== Starting deploy ==="
          Set-Location "${{ secrets.PROJECT_PATH }}" -ErrorAction Stop

          # Anonymous docker config: pulls never depend on the host credential helper.
          $cfgDir = Join-Path $env:TEMP 'cookievale-docker-config'
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          '{"auths":{}}' | Set-Content (Join-Path $cfgDir 'config.json')
          $env:DOCKER_CONFIG = $cfgDir

          $before = git rev-parse HEAD

          Write-Host "=== Git fetch ==="
          git fetch origin master
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }

          Write-Host "=== Git reset ==="
          git reset --hard origin/master
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

          # Load versions.env (after reset, so bumps apply) for compose interpolation.
          Get-Content versions.env | ForEach-Object {
            if ($_ -match '^([A-Z_]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }

          Write-Host "=== Docker build ==="
          $infraChanged = git diff --name-only $before HEAD | Select-String -Pattern '^(Dockerfile|requirements(-dev)?\.txt|versions\.env|docker-compose\.yml|\.dockerignore)$'
          if ($infraChanged) {
            docker compose build
            if ($LASTEXITCODE -ne 0) { throw "docker compose build failed" }
          } else {
            Write-Host "No image-affecting changes, skipping build"
          }

          Write-Host "=== Docker migrate ==="
          docker compose run --rm web alembic upgrade head
          if ($LASTEXITCODE -ne 0) { throw "alembic upgrade failed" }

          Write-Host "=== Docker up ==="
          docker compose up -d --force-recreate
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed" }

          Write-Host "=== Verify services ==="
          docker compose ps
          if ($LASTEXITCODE -ne 0) { throw "docker compose ps failed" }
          if ((docker compose ps) -match 'Exit') { throw "a service is not running" }

          Write-Host "=== Health check ==="
          $retries = 0
          while ($retries -lt 5) {
            try {
              $ProgressPreference = 'SilentlyContinue'
              $null = Invoke-WebRequest -Uri http://localhost:8000/health -UseBasicParsing -TimeoutSec 5
              Write-Host "=== Deploy complete ==="
              exit 0
            } catch {
              $retries++
              Write-Host "Health check attempt $retries failed, retrying in 5s..."
              Start-Sleep -Seconds 5
            }
          }
          throw "Health check failed after 5 attempts"
          PSEOF
          )"

          B64="$(printf '%s' "$SCRIPT" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $B64"
