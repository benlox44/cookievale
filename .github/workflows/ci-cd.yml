name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy app/

  css-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-tailwind
        with:
          path: tailwindcss-linux-x64
          key: tailwindcss-${{ runner.os }}-3.4.17
      - name: Download TailwindCSS CLI
        if: steps.cache-tailwind.outputs.cache-hit != 'true'
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
      - name: Compile and verify no diff
        run: |
          ./tailwindcss-linux-x64 -i public/tailwind.css -o public/styles.css --minify
          git diff --exit-code public/styles.css || (echo "public/styles.css is stale. Run 'make css' and commit." && exit 1)

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, format, mypy, css-check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cookievale .

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" powershell -NoProfile -ExecutionPolicy Bypass -Command - <<'PSEOF'
          Write-Host "=== Starting deploy ==="
          Set-Location "${{ secrets.PROJECT_PATH }}" -ErrorAction Stop
          Write-Host "Current directory: $(Get-Location)"
          Get-ChildItem

          Write-Host "=== Git fetch ==="
          git fetch origin master
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }

          Write-Host "=== Git reset ==="
          git reset --hard origin/master
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
          git status

          Write-Host "=== Docker build ==="
          docker compose build
          if ($LASTEXITCODE -ne 0) { throw "docker compose build failed" }

          Write-Host "=== Docker migrate ==="
          docker compose run --rm web alembic upgrade head
          if ($LASTEXITCODE -ne 0) { throw "alembic upgrade failed" }

          Write-Host "=== Docker up ==="
          docker compose up -d --force-recreate
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed" }

          Write-Host "=== Health check ==="
          $retries = 0
          while ($retries -lt 5) {
            try {
              $ProgressPreference = 'SilentlyContinue'
              $null = Invoke-WebRequest -Uri http://localhost:8000/health -UseBasicParsing -TimeoutSec 5
              Write-Host "=== Deploy complete ==="
              exit 0
            } catch {
              $retries++
              Write-Host "Health check attempt $retries failed, retrying in 5s..."
              Start-Sleep -Seconds 5
            }
          }
          throw "Health check failed after 5 attempts"
          PSEOF
