<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Galletas artesanales personalizadas para tus momentos especiales en La Serena y Coquimbo. Haz tu pedido y disfruta del sabor único de CookieVale.">
    <meta property="og:title" content="CookieVale">
    <meta property="og:description"
        content="Galletas artesanales personalizadas para tus momentos especiales en La Serena y Coquimbo. Haz tu pedido en CookieVale.">
    <meta property="og:image" content="{{ base_url }}/public/icons/icon.png">
    <meta property="og:url" content="{{ base_url }}{{ request.url.path }}">
    <link rel="canonical" href="{{ base_url }}{{ request.url.path }}">
    <title>{% block title %}CookieVale{% endblock %}</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="/public/favicons/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/public/favicons/favicon.svg">
    <link rel="shortcut icon" href="/public/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CookieVale">
    <link rel="manifest" href="/public/favicons/site.webmanifest">

    <!-- Fonts: Playfair Display (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/public/styles.css?v={{ css_version() }}">

    <script src="/public/vendor/htmx.min.js"></script>

    <script>
        try {
            if (!navigator.clipboard) {
                navigator.clipboard = { readText: () => Promise.resolve(''), writeText: () => Promise.resolve() };
            } else if (!navigator.clipboard.readText) {
                navigator.clipboard.readText = () => Promise.resolve('');
            }
        } catch(e) { /* clipboard API not available */ }
    </script>
    <script>
        // Hide the browser's URL preview (bottom-left status bar) while hovering
        // links. The real href is stashed in a data attribute during hover and
        // restored on mousedown (so clicks still navigate) or mouseout. Touch and
        // keyboard navigation are unaffected since they don't fire mouse events.
        document.addEventListener('mouseover', function (e) {
            var a = e.target.closest && e.target.closest('a[href]');
            if (a && !a.dataset.hiddenHref) {
                a.dataset.hiddenHref = a.getAttribute('href');
                a.removeAttribute('href');
            }
        });
        function restoreHref(e) {
            var a = e.target.closest && e.target.closest('a[data-hidden-href]');
            if (a) {
                a.setAttribute('href', a.dataset.hiddenHref);
                delete a.dataset.hiddenHref;
            }
        }
        document.addEventListener('mousedown', restoreHref);
        document.addEventListener('mouseout', restoreHref);
    </script>
    <script src="/public/vendor/alpine-sort.min.js" defer></script>
    <script src="/public/vendor/alpine.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
        /* Keep the pointer cursor on links while their href is hidden during hover. */
        a[data-hidden-href] { cursor: pointer; }
    </style>

</head>

<body class="{% block body_class %}min-h-screen flex flex-col overflow-x-clip{% endblock %}">

    {% set is_admin = request and '/admin' in request.url.path %}
    {% block header %}
    {% if is_admin %}
    {% include "admin/partials/header.html" %}
    {% else %}
    {% include "client/partials/header.html" %}
    {% endif %}
    {% endblock %}

    <main class="{% block main_class %}max-w-4xl mx-auto px-4 md:px-8 py-8 flex-grow w-full{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/toast.html" %}

</body>

</html>
