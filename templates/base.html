<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CookieVale{% endblock %}</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="/public/favicons/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/public/favicons/favicon.svg">
    <link rel="shortcut icon" href="/public/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CookieVale">
    <link rel="manifest" href="/public/favicons/site.webmanifest">

    <!-- Fonts: Playfair Display (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        // From the icon: pink bow, golden cookie, dark brown outlines
                        cookie: {
                            pink: '#fdd0cd', // bow / brand color
                            peach: '#F4A07A', // cheeks / warm accent
                            golden: '#D4956A', // cookie body
                            brown: '#7B3F2B', // outlines / dark text
                            cream: '#FDF5EE', // very light background
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        /* Standalone classes equivalent to expected Tailwind classes to bypass TS/CSS errors */
        .btn-primary {
            padding: 0.5rem 1.5rem;
            background-color: #1f2937;
            color: white;
            border-radius: 0.375rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }

        .btn-primary:hover {
            background-color: #374151;
        }

        .btn-secondary {
            padding: 0.5rem 1.5rem;
            border-width: 1px;
            border-color: #d1d5db;
            color: #374151;
            background-color: white;
            border-radius: 0.375rem;
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-secondary:hover {
            background-color: #f9fafb;
        }
    </style>

    <style>
        /* Design tokens as CSS vars for consistency */
        :root {
            --text-heading: #3D1F10;
            /* very dark brown */
            --text-body: #5C3D2E;
            /* medium brown */
            --text-muted: #A0806E;
            /* light brown */
            --border: #F0DED5;
            --bg-page: #FDF5EE;
            /* cookie cream */
            --bg-card: #FFFFFF;
            --accent: #D4956A;
            /* golden cookie */
            --accent-hover: #C07A52;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-body);
        }

        /* Unified heading sizes — only 3 sizes used across all pages */
        .cv-h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-heading);
            line-height: 1.2;
        }

        .cv-h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-heading);
        }

        .cv-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-body);
            letter-spacing: 0.02em;
        }

        /* Shared card */
        .cv-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 1.5rem;
        }

        /* Shared input */
        .cv-input {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 0.875rem;
            border: 1.5px solid var(--border);
            background-color: #FFFBF9;
            font-size: 0.9375rem;
            color: var(--text-heading);
            transition: border-color 0.15s;
            outline: none;
        }

        .cv-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 149, 106, 0.15);
        }

        /* Primary button */
        .cv-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            background-color: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: background-color 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(212, 149, 106, 0.35);
        }

        .cv-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(212, 149, 106, 0.4);
        }

        .cv-btn:active {
            transform: translateY(0);
        }

        .cv-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Ghost button */
        .cv-btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            background: white;
            border: 1.5px solid var(--border);
            color: var(--text-body);
            font-weight: 600;
            font-size: 0.9375rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .cv-btn-ghost:hover {
            border-color: var(--accent);
            background: #FEF6F1;
        }

        /* Status badges */
        .badge-pending {
            background: #FFF3CD;
            color: #7B5800;
            border: 1px solid #FFE08A;
        }

        .badge-confirmed {
            background: #D1ECF1;
            color: #0C5460;
            border: 1px solid #99D9E9;
        }

        .badge-paid {
            background: #D4EDDA;
            color: #155724;
            border: 1px solid #9FD6AF;
        }

        .badge-delivered {
            background: #E2E3E5;
            color: #383D41;
            border: 1px solid #C6C8CA;
        }

        .badge {
            padding: 0.2rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body class="{% block body_class %}min-h-screen flex flex-col overflow-x-hidden{% endblock %}">

    {% set is_admin = request and '/admin' in request.url.path %}
    {% block header %}
    {% if is_admin %}
    {% include "admin/partials/header.html" %}
    {% else %}
    {% include "client/partials/header.html" %}
    {% endif %}
    {% endblock %}

    <main class="{% block main_class %}max-w-4xl mx-auto px-4 md:px-8 py-8 flex-grow w-full{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/toast.html" %}

</body>

</html>
