<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CookieVale{% endblock %}</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="/public/favicons/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/public/favicons/favicon.svg">
    <link rel="shortcut icon" href="/public/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CookieVale">
    <link rel="manifest" href="/public/favicons/site.webmanifest">

    <!-- Fonts: Playfair Display (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        // From the icon: pink bow, golden cookie, dark brown outlines
                        cookie: {
                            pink: '#fdd0cd', // bow / brand color
                            peach: '#F4A07A', // cheeks / warm accent
                            golden: '#D4956A', // cookie body
                            brown: '#7B3F2B', // outlines / dark text
                            cream: '#FDF5EE', // very light background
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style type="text/tailwindcss">
        @layer components {
            .btn-primary {
                @apply px-6 py-2 bg-gray-800 text-white rounded-md hover:bg-gray-700 transition inline-flex items-center justify-center gap-2;
            }
            .btn-secondary {
                @apply px-6 py-2 border border-gray-300 text-gray-700 bg-white rounded-md hover:bg-gray-50 transition inline-flex items-center justify-center gap-2;
            }
            .cv-input {
                @apply w-full px-4 py-2 border border-gray-300 rounded-md focus:border-gray-800 focus:ring-1 focus:ring-gray-800 outline-none transition-all;
            }
        }
    </style>

    <style>
        /* Design tokens as CSS vars for consistency */
        :root {
            --text-heading: #3D1F10;
            /* very dark brown */
            --text-body: #5C3D2E;
            /* medium brown */
            --text-muted: #A0806E;
            /* light brown */
            --border: #F0DED5;
            --bg-page: #FDF5EE;
            /* cookie cream */
            --bg-card: #FFFFFF;
            --accent: #D4956A;
            /* golden cookie */
            --accent-hover: #C07A52;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-body);
        }

        /* Unified heading sizes — only 3 sizes used across all pages */
        .cv-h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-heading);
            line-height: 1.2;
        }

        .cv-h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-heading);
        }

        .cv-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-body);
            letter-spacing: 0.02em;
        }

        /* Shared card */
        .cv-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 1.5rem;
        }

        /* Shared input */
        .cv-input {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 0.875rem;
            border: 1.5px solid var(--border);
            background-color: #FFFBF9;
            font-size: 0.9375rem;
            color: var(--text-heading);
            transition: border-color 0.15s;
            outline: none;
        }

        .cv-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 149, 106, 0.15);
        }

        /* Primary button */
        .cv-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            background-color: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: background-color 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(212, 149, 106, 0.35);
        }

        .cv-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(212, 149, 106, 0.4);
        }

        .cv-btn:active {
            transform: translateY(0);
        }

        .cv-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Ghost button */
        .cv-btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            background: white;
            border: 1.5px solid var(--border);
            color: var(--text-body);
            font-weight: 600;
            font-size: 0.9375rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .cv-btn-ghost:hover {
            border-color: var(--accent);
            background: #FEF6F1;
        }

        /* Status badges */
        .badge-pending {
            background: #FFF3CD;
            color: #7B5800;
            border: 1px solid #FFE08A;
        }

        .badge-confirmed {
            background: #D1ECF1;
            color: #0C5460;
            border: 1px solid #99D9E9;
        }

        .badge-paid {
            background: #D4EDDA;
            color: #155724;
            border: 1px solid #9FD6AF;
        }

        .badge-delivered {
            background: #E2E3E5;
            color: #383D41;
            border: 1px solid #C6C8CA;
        }

        .badge {
            padding: 0.2rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body class="{% block body_class %}min-h-screen flex flex-col{% endblock %}">

    {% block header %}
    <header class="bg-white/80 backdrop-blur-md border-b border-cookie-pink/40 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 md:px-8 py-3.5 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 group">
                <div
                    class="w-9 h-9 rounded-full bg-cookie-pink/30 flex items-center justify-center group-hover:bg-cookie-pink/50 transition-colors">
                    <img src="/public/icons/icon.png" alt="CookieVale" class="w-7 h-7 object-contain">
                </div>
                <span class="font-serif font-bold text-xl text-cookie-brown tracking-tight">CookieVale</span>
            </a>
            <a href="https://instagram.com/cookievale.ls" target="_blank"
                class="flex items-center gap-1.5 text-sm font-medium text-cookie-brown/70 hover:text-pink-600 transition-colors">
                <svg class="w-5 h-5 text-pink-500" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" />
                </svg>
                <span class="hidden sm:inline">@cookievale.ls</span>
            </a>
        </div>
    </header>
    {% endblock %}

    <main class="{% block main_class %}max-w-4xl mx-auto px-4 md:px-8 py-8 flex-grow w-full{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
