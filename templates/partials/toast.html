<!-- Global Toast Component -->
<div x-data="toastHandler()" @show-toast.window="add($event.detail)"
    class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
        <div x-show="toast.visible" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="min-w-[250px] max-w-sm bg-white border border-cookie-pink/40 shadow-xl rounded-xl overflow-hidden pointer-events-auto flex flex-col">
            <div class="p-4 text-cookie-brown font-medium text-sm whitespace-pre-wrap" x-text="toast.message"></div>

            <div class="h-1 w-full" :class="toast.type === 'error' ? 'bg-red-100' : 'bg-cookie-pink/20'">
                <div class="h-full transition-all duration-[100ms] ease-linear"
                    :class="toast.type === 'error' ? 'bg-red-500' : 'bg-cookie-golden'"
                    :style="`width: ${toast.progress}%`"></div>
            </div>
        </div>
    </template>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('toastHandler', () => ({
            toasts: [],
            add({ message, type = 'success', duration = 4000 }) {
                const id = Date.now() + Math.random();
                const toast = { id, message, type, duration, visible: true, progress: 100 };
                this.toasts.push(toast);

                const updateInterval = 50;
                const steps = duration / updateInterval;
                let currentStep = 0;

                const interval = setInterval(() => {
                    currentStep++;
                    const t = this.toasts.find(t => t.id === id);
                    if (t) {
                        t.progress = Math.max(0, 100 - (currentStep / steps * 100));
                    }
                }, updateInterval);

                setTimeout(() => {
                    clearInterval(interval);
                    const t = this.toasts.find(t => t.id === id);
                    if (t) {
                        t.visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(x => x.id !== id);
                        }, 300);
                    }
                }, duration);
            }
        }));
    });
</script>
