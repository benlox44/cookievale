{% macro render_uploader(max_images=0, is_required=False, existing_images=[]) %}
{% set existing_cnt = existing_images|length %}
<div class="mb-4" x-data="{
    files: [],
    previews: [],
    handleFiles(evt) {
        const newFiles = Array.from(evt.target.files);
        if ({{ max_images }} > 0 && this.files.length + {{ existing_cnt }} + newFiles.length > {{ max_images }}) {
            alert('Solo puedes subir un m\u00E1ximo de {{ max_images }} im\u00E1genes en total.');
            evt.target.value = '';
            return;
        }
        this.files = [...this.files, ...newFiles];
        this.previews = this.files.map(f => URL.createObjectURL(f));
        this.updateInputFiles();
        evt.target.value = '';
    },
    removeFile(idx) {
        this.files.splice(idx, 1);
        this.previews.splice(idx, 1);
        this.updateInputFiles();
    },
    updateInputFiles() {
        const dt = new DataTransfer();
        this.files.forEach(f => dt.items.add(f));
        if (this.$refs.photoInput) {
            this.$refs.photoInput.files = dt.files;
        }
    }
}">
    <div class="relative rounded-2xl border-2 border-dashed border-cookie-pink/50 bg-cookie-cream/50 transition-all text-center p-6 min-h-[140px] flex flex-col justify-center items-center"
        :class="(files.length === 0 && {{ existing_cnt }} === 0) ? 'hover:border-cookie-golden/60 hover:bg-cookie-pink/10 cursor-pointer' : ''">

        <!-- Input layer when empty -->
        <input type="file" name="photos" multiple accept="image/*" @change="handleFiles" x-ref="photoInput"
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
            x-show="files.length === 0 && {{ existing_cnt }} === 0" {% if is_required %}required{% endif %}>

        <div class="flex flex-col items-center w-full">
            <div x-show="files.length === 0 && {{ existing_cnt }} === 0"
                class="flex flex-col items-center pointer-events-none">
                <svg class="w-8 h-8 text-cookie-brown/30 transition-colors mb-2" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="text-sm text-cookie-brown/50"><span class="text-cookie-golden font-semibold">Haz
                        click</span> o arrastra tus imágenes</span>
            </div>

            <div x-show="files.length > 0 || {{ existing_cnt }} > 0"
                class="flex justify-center gap-4 flex-wrap w-full relative z-20">
                {% if existing_images %}
                {% for img in existing_images %}
                <div x-data="{ removed: false }" x-show="!removed"
                    class="relative group rounded-xl overflow-hidden border-2 border-cookie-pink/50 shadow-sm w-24 h-24">
                    <img src="{{ img }}" class="w-full h-full object-cover" />
                    <input type="hidden" name="existing_images" value="{{ img }}" x-bind:disabled="removed" />
                    <button type="button" @click.prevent="removed = true"
                        class="absolute inset-0 bg-red-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center cursor-pointer z-30">
                        <svg class="w-6 h-6 text-white mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        <span class="text-white text-[10px] uppercase font-bold tracking-wider">Eliminar</span>
                    </button>
                </div>
                {% endfor %}
                {% endif %}

                <template x-for="(preview, idx) in previews" :key="idx">
                    <div
                        class="relative group rounded-xl overflow-hidden border-2 border-cookie-pink/50 shadow-sm w-24 h-24 z-30">
                        <img :src="preview" class="w-full h-full object-cover" />
                        <button type="button" @click.prevent="removeFile(idx)"
                            class="absolute inset-0 bg-red-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center cursor-pointer z-40">
                            <svg class="w-6 h-6 text-white mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            <span class="text-white text-[10px] uppercase font-bold tracking-wider">Eliminar</span>
                        </button>
                    </div>
                </template>

                <div x-show="{{ max_images }} === 0 || (files.length + {{ existing_cnt }} < {{ max_images }})"
                    class="relative group rounded-xl border-2 border-dashed border-cookie-pink/50 hover:border-cookie-golden w-24 h-24 flex flex-col items-center justify-center cursor-pointer overflow-hidden text-cookie-brown/50 hover:text-cookie-golden transition-colors z-30">
                    <input type="file" multiple accept="image/*" @change="handleFiles"
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-40">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span class="text-[10px] uppercase font-bold tracking-wider">Añadir</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
