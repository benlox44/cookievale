{% macro render_product_picker(products) %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-10">
    {% for product in products %}
    <div
        class="cv-card p-4 flex flex-col justify-between hover:shadow-[0_8px_24px_rgba(212,149,106,0.18)] hover:-translate-y-1 hover:border-cookie-golden/40 transition-all duration-300 group">
        {% include "partials/slider.html" %}
        {% include "partials/product_info.html" %}
        <div
            class="flex items-center justify-between bg-cookie-cream rounded-xl p-1.5 border border-cookie-pink/30">
            <button type="button" @click="removeItem({{ product.id }})"
                class="w-9 h-9 flex items-center justify-center rounded-lg text-cookie-brown/60 hover:bg-white hover:shadow-sm hover:text-red-400 transition-all active:scale-90 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4" />
                </svg>
            </button>
            <input type="number" min="0" max="999" :value="getQuantity({{ product.id }})"
                @input="if($event.target.value.length > 3) $event.target.value = $event.target.value.slice(0,3); setQuantity({{ product.id }}, '{{ product.name }}', {{ product.price }}, $event.target.value)"
                title="Escribe la cantidad que deseas"
                class="w-16 text-center font-bold text-cookie-brown bg-white border border-cookie-pink/20 rounded-md mx-2 box-border focus:outline-none focus:ring-2 focus:ring-cookie-pink/40 transition-all shadow-inner [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
                style="-moz-appearance: textfield; appearance: textfield;">
            <button type="button" @click="addItem({{ product.id }}, '{{ product.name }}', {{ product.price }})"
                class="w-9 h-9 flex items-center justify-center rounded-lg bg-cookie-pink/40 text-cookie-brown hover:bg-cookie-golden hover:text-white transition-all active:scale-90 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
    </div>
    {% else %}
    {% include "partials/empty_products.html" %}
    {% endfor %}
</div>
{% endmacro %}
