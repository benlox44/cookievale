<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('cookieCart', (initialItems = [], onChange = null) => ({
        cart: (initialItems || []).map(i => ({
            product_id: i.product_id,
            name: i.name,
            price: i.price,
            quantity: i.quantity
        })),
        cartJson: '[]',
        pendingFiles: [],

        init() {
            this.updateJson();
            window.addEventListener('cart-files', (e) => {
                this.pendingFiles = e.detail || [];
            });
        },

        getQuantity(productId) {
            const item = this.cart.find(i => i.product_id === productId);
            return item ? item.quantity : 0;
        },
        addItem(productId, name, price) {
            const item = this.cart.find(i => i.product_id === productId);
            if (item) { item.quantity++; }
            else { this.cart.push({ product_id: productId, name, price, quantity: 1 }); }
            this.updateJson();
        },
        removeItem(productId) {
            const idx = this.cart.findIndex(i => i.product_id === productId);
            if (idx !== -1) {
                if (this.cart[idx].quantity > 1) { this.cart[idx].quantity--; }
                else { this.cart.splice(idx, 1); }
            }
            this.updateJson();
        },
        setQuantity(productId, name, price, quantity) {
            let parsedQty = parseInt(quantity);
            if (isNaN(parsedQty) || parsedQty < 0) return;
            if (parsedQty > 999) parsedQty = 999;

            const idx = this.cart.findIndex(i => i.product_id === productId);
            if (parsedQty === 0) {
                if (idx !== -1) { this.cart.splice(idx, 1); }
            } else {
                if (idx !== -1) { this.cart[idx].quantity = parsedQty; }
                else { this.cart.push({ product_id: productId, name, price, quantity: parsedQty }); }
            }
            this.updateJson();
        },
        get cartTotal() {
            return this.cart.reduce((t, i) => t + i.price * i.quantity, 0);
        },
        updateJson() {
            this.cartJson = JSON.stringify(this.cart.map(i => ({ product_id: i.product_id, quantity: i.quantity })));
            if (onChange) onChange(this.cartJson, this.cartTotal, this.cart);
        },
        prepSubmit() { this.updateJson(); },

        async submitOrder(event) {
            event.preventDefault();
            this.updateJson();

            const form = event.target;
            const formData = new FormData(form);
            // DataTransfer-populated input covers htmx/native submissions; only
            // append from the event on old iOS where setting input.files fails.
            const photoInput = form.querySelector('input[name="photos"]');
            if (!photoInput || photoInput.files.length === 0) {
                this.pendingFiles.forEach((file) => formData.append('photos', file, file.name));
            }

            const button = form.querySelector('button[type="submit"]');
            if (button) button.disabled = true;

            try {
                const response = await fetch('/orders', { method: 'POST', body: formData });

                const triggerHeader = response.headers.get('HX-Trigger');
                if (triggerHeader) {
                    try {
                        const payload = JSON.parse(triggerHeader);
                        const toast = payload['show-toast'];
                        if (toast) {
                            window.dispatchEvent(new CustomEvent('show-toast', { detail: { message: toast.message, type: toast.type } }));
                        }
                    } catch (err) { /* malformed HX-Trigger: ignore */ }
                }

                if (!response.ok) {
                    try {
                        const data = await response.json();
                        if (data && data.detail) {
                            window.dispatchEvent(new CustomEvent('show-toast', { detail: { message: data.detail, type: 'error' } }));
                        }
                    } catch (err) { /* non-JSON error body: ignore */ }
                    return;
                }

                const html = await response.text();
                if (!html.trim()) return;

                const container = document.getElementById('form-container');
                if (!container) return;

                const template = document.createElement('template');
                template.innerHTML = html;
                const node = template.content.firstElementChild;
                if (!node) return;

                node.style.opacity = '0';
                node.style.transition = 'opacity 300ms ease';
                container.replaceWith(node);
                if (window.Alpine) Alpine.initTree(node);
                requestAnimationFrame(() => { node.style.opacity = '1'; });
            } finally {
                if (button) button.disabled = false;
            }
        },
    }));
});
</script>
