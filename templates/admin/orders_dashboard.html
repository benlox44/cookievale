{% extends "base.html" %}
{% block title %}Panel de Órdenes - CookieVale{% endblock %}

{% block content %}

<div class="w-full">
    <!-- Header -->
    <div class="cv-card mb-6 flex flex-wrap items-center justify-between gap-4 py-4 px-6 md:px-8">
        <div class="flex items-center gap-4">
            <a href="/admin"
                class="text-cookie-golden hover:text-cookie-brown bg-cookie-cream inline-flex items-center justify-center w-10 h-10 rounded-full border border-cookie-pink/40 hover:border-cookie-golden shadow-sm transition-all"
                title="Volver">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="cv-h2 m-0">Órdenes</h1>
        </div>

        <div class="flex items-center gap-4">
            <div
                x-data="{ showClosed: {{ 'true' if include_closed else 'false' }}, toggle() { this.showClosed = !this.showClosed; htmx.ajax('GET', '/admin/orders?include_closed=' + this.showClosed, { target: '#orders-table-container', swap: 'innerHTML' }); } }">
                <button type="button" @click="toggle()"
                    :class="showClosed
                        ? 'bg-cookie-golden text-white border-cookie-golden shadow-sm'
                        : 'bg-white text-cookie-brown border-cookie-golden'"
                    class="text-xs px-4 py-2 rounded-full border font-medium flex items-center gap-1.5 transition-all select-none">
                    <span x-text="showClosed ? 'Ocultar cerradas' : 'Mostrar cerradas'"></span>
                </button>
            </div>
            <a href="/admin/orders/new"
                class="cv-btn text-xs px-4 py-2 flex items-center gap-1.5 flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
                Crear Orden
            </a>
        </div>
    </div>

    <!-- Table -->
    <div class="cv-card p-0 overflow-hidden">
        <div id="orders-table-container">
            {% include "components/admin/orders_table.html" %}
        </div>
    </div>
</div>
{% endblock %}
