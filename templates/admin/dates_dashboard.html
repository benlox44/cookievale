{% extends "base.html" %}
{% block title %}Panel de Disponibilidad - CookieVale{% endblock %}

{% block content %}
<div class="w-full max-w-4xl mx-auto">
    <!-- Header -->
    <div class="cv-card mb-6 flex flex-col md:flex-row justify-between items-center py-4 px-6 md:px-8 gap-4">
        <div class="flex items-center gap-4 flex-shrink-0 w-full md:w-auto">
            <a href="/admin"
                class="text-cookie-golden hover:text-cookie-brown bg-cookie-cream inline-flex items-center justify-center w-10 h-10 rounded-full border border-cookie-pink/40 hover:border-cookie-golden shadow-sm transition-all"
                title="Volver">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="cv-h2 m-0 flex items-center gap-2">Fechas Disponibles</h1>
        </div>
    </div>

    <!-- Calendar -->
    <div class="cv-card mb-6 p-6" x-data="adminCalendar(
        [{% for d in dates %}{ id: {{ d.id }}, date: '{{ d.date.strftime('%Y-%m-%d') }}', occupied: {{ 'true' if d.is_occupied else 'false' }} }{% if not loop.last %},{% endif %}{% endfor %}],
        '{{ today }}'
    )">
        <!-- Month nav -->
        <div class="flex items-center justify-between mb-4">
            <button type="button" @click="prevMonth()"
                class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-cookie-pink/20 transition-colors">
                <svg class="w-5 h-5 text-cookie-brown" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <span class="font-serif font-bold text-xl text-cookie-brown capitalize" x-text="monthLabel"></span>
            <button type="button" @click="nextMonth()"
                class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-cookie-pink/20 transition-colors">
                <svg class="w-5 h-5 text-cookie-brown" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>

        <!-- Day headers -->
        <div class="grid grid-cols-7 gap-1 mb-2">
            <template x-for="d in ['Lu','Ma','Mi','Ju','Vi','Sa','Do']" :key="d">
                <div class="text-center text-xs font-semibold text-cookie-brown/50 py-1" x-text="d"></div>
            </template>
        </div>

        <!-- Days grid -->
        <div class="grid grid-cols-7 gap-1">
            <template x-for="day in days" :key="day.key">
                <button type="button" @click="handleClick(day)" :disabled="day.isPast && !day.status"
                    :class="{
                        'bg-red-50 text-red-500 cursor-default': day.status === 'occupied',
                        'bg-green-50 text-green-700 cursor-pointer': day.status === 'free',
                        'text-cookie-brown/20 cursor-not-allowed': day.isPast && !day.status,
                        'text-cookie-brown cursor-pointer': !day.isPast && !day.status
                    }"
                    class="h-10 w-full rounded-lg text-sm transition-colors flex items-center justify-center"
                    x-text="day.num || ''">
                </button>
            </template>
        </div>

        <!-- Confirm delete modal -->
        <div x-show="showConfirm" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
            <div @click.away="showConfirm = false"
                class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                <h3 class="text-lg font-bold text-cookie-brown mb-2">Eliminar Fecha</h3>
                <p class="text-cookie-brown/70 text-sm mb-6">¿Estás seguro de eliminar esta fecha libre?</p>
                <div class="flex justify-end gap-3">
                    <button type="button" @click="showConfirm = false"
                        class="cv-btn bg-cookie-cream text-cookie-brown border-cookie-pink/40 hover:bg-cookie-pink/10 hover:border-cookie-golden">Cancelar</button>
                    <button type="button" @click="confirmDelete()"
                        class="cv-btn bg-red-500 hover:bg-red-600 text-white border-red-500 shadow-red-200">Eliminar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function adminCalendar(dates, today) {
    var pad = function(n) { return String(n).padStart(2,'0'); };
    var parts = today.split('-');
    var ty = parseInt(parts[0]), tm = parseInt(parts[1]), td = parseInt(parts[2]);
    var todayDate = new Date(ty, tm-1, td);
    todayDate.setHours(0,0,0,0);
    var MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    var _statusMap = {};
    dates.forEach(function(d) { _statusMap[d.date] = d; });

    function buildDays(year, month) {
        var first = new Date(year, month, 1);
        var last = new Date(year, month + 1, 0);
        var offset = (first.getDay() + 6) % 7;
        var result = [];
        for (var i = 0; i < offset; i++) result.push({ key: 'e'+i, num: '', isPast: false });

        for (var d = 1; d <= last.getDate(); d++) {
            var ds = year + '-' + pad(month + 1) + '-' + pad(d);
            var dt = new Date(year, month, d);
            var entry = _statusMap[ds] || null;
            result.push({
                key: ds, num: d, date: ds,
                status: entry ? (entry.occupied ? 'occupied' : 'free') : null,
                id: entry ? entry.id : null,
                isPast: dt < todayDate
            });
        }
        return result;
    }

    return {
        year: ty,
        month: tm - 1,
        days: buildDays(ty, tm - 1),
        showConfirm: false,
        pendingDelete: null,

        get monthLabel() { return MONTHS[this.month] + ' ' + this.year; },

        init: function() {
            var self = this;
            this.$watch('year', function() { self.days = buildDays(self.year, self.month); });
            this.$watch('month', function() { self.days = buildDays(self.year, self.month); });
        },

        prevMonth: function() { this.month--; if (this.month < 0) { this.month = 11; this.year--; } },
        nextMonth: function() { this.month++; if (this.month > 11) { this.month = 0; this.year++; } },

        handleClick: function(day) {
            if (!day.num || day.isPast) return;
            if (!day.status) {
                this.createDate(day.date);
            } else if (day.status === 'free') {
                this.pendingDelete = { id: day.id, date: day.date };
                this.showConfirm = true;
            }
        },

        confirmDelete: function() {
            if (!this.pendingDelete) return;
            var id = this.pendingDelete.id;
            var dateStr = this.pendingDelete.date;
            this.showConfirm = false;
            this.pendingDelete = null;
            var self = this;

            fetch('/admin/dates/' + id, { method: 'DELETE' })
                .then(function(r) {
                    if (r.ok) {
                        delete _statusMap[dateStr];
                        self.days = buildDays(self.year, self.month);
                    } else {
                        return r.json().catch(function() { return {}; }).then(function(data) {
                            var msg = (typeof data.detail === 'string') ? data.detail : 'Error al eliminar';
                            window.dispatchEvent(new CustomEvent('show-toast', { detail: { message: msg } }));
                        });
                    }
                })
                .catch(function() {
                    window.dispatchEvent(new CustomEvent('show-toast', { detail: { message: 'Error de conexión' } }));
                });
        },

        createDate: function(dateStr) {
            var form = new FormData();
            form.append('selected_date', dateStr);
            var self = this;

            fetch('/admin/dates', { method: 'POST', body: form })
                .then(function(r) {
                    if (r.ok) {
                        return r.json().then(function(data) {
                            _statusMap[dateStr] = { id: data.id, date: dateStr, occupied: false };
                            self.days = buildDays(self.year, self.month);
                        });
                    } else {
                        return r.json().catch(function() { return {}; }).then(function(data) {
                            var msg = (typeof data.detail === 'string') ? data.detail : 'Error al crear';
                            window.dispatchEvent(new CustomEvent('show-toast', { detail: { message: msg } }));
                        });
                    }
                })
                .catch(function() {
                    window.dispatchEvent(new CustomEvent('show-toast', { detail: { message: 'Error de conexión' } }));
                });
        }
    };
}
</script>
{% endblock %}
