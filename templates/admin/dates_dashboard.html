{% extends "base.html" %}
{% block title %}Panel de Disponibilidad - CookieVale{% endblock %}

{% block content %}
<div class="w-full max-w-4xl mx-auto">
    <!-- Header -->
    <div class="cv-card mb-6 flex flex-col md:flex-row justify-between items-center py-4 px-6 md:px-8 gap-4">
        <div class="flex items-center gap-4 flex-shrink-0 w-full md:w-auto">
            <a href="/admin"
                class="text-cookie-golden hover:text-cookie-brown bg-cookie-cream inline-flex items-center justify-center w-10 h-10 rounded-full border border-cookie-pink/40 hover:border-cookie-golden shadow-sm transition-all"
                title="Volver">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="cv-h2 m-0 flex items-center gap-2">Fechas Disponibles</h1>
        </div>
    </div>

    <!-- Add Date Form -->
    <div class="cv-card mb-6 p-6">
        <h2 class="text-xl font-bold text-cookie-brown mb-4">Agregar Fecha</h2>
        <form hx-post="/admin/dates" hx-target="#dates-list" hx-swap="outerHTML" class="flex flex-col sm:flex-row gap-4 items-end">
            <div class="w-full sm:w-auto flex-1">
                <label class="block text-sm font-medium text-cookie-brown/80 mb-2">Seleccionar Fecha</label>
                <input type="date" name="selected_date" required min="{{ today }}" class="cv-input w-full">
            </div>
            <button type="submit" class="cv-btn whitespace-nowrap h-[42px] px-8">
                Agregar
            </button>
        </form>
    </div>

    <!-- Dates List -->
    <div id="dates-list">
        {% include "admin/partials/dates_list.html" %}
    </div>

</div>
{% endblock %}
