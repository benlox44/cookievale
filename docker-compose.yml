services:
  web:
    build: .
    volumes:
      - .:/app
      - ${MEDIA_ROOT}:/app_media
      - ${BACKUP_DEST}:/app_backup
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CONTAINER_MEDIA_PATH=/app_media
      - CONTAINER_BACKUP_PATH=/app_backup
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
