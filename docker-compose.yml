services:
  web:
    build: .
    volumes:
      - .:/app
      - ${MEDIA_ROOT}:/app_media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CONTAINER_MEDIA_PATH=/app_media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cookie_user
      - POSTGRES_PASSWORD=cookie_pass
      - POSTGRES_DB=cookievale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookie_user -d cookievale"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
